name: UI Tests

on:
  workflow_dispatch: #запустить вручную нажатием кнопки на гитхаб

jobs: #список работ
  test-chrome: #название работы
    runs-on: ubuntu-latest #запусти на своем виртуальном компьютере, возьми чистую временнную версию линукс

    steps:
      - uses: actions/checkout@v4 #минус это один шаг

      - uses: action/setup-python@v7
        with:
          python-version: "3.12"

#устанавливаем пакеты
      - run: pip install -r requirements.txt #виртуальная машину установи все что записано в файле рекваиренментс

      - run: pytest tests/test_login.py --browser=chrome --headless